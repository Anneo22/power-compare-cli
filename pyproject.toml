[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "power-compare"
version = "0.1.0"
description = "Local FIT and CSV cycling power comparisons with explicit clocks and test guidance"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["fitdecode>=0.11,<1"]

[project.scripts]
power-compare = "power_compare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
